<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1712" />
    <title>Nevolium · offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #07100d; color: #e8f3ed; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { max-width: 520px; border: 1px solid #284238; border-radius: 24px; padding: 32px; background: #0b1712; }
      p { color: #9db4a9; line-height: 1.6; }
      button { min-height: 44px; border: 1px solid #73cca2; border-radius: 999px; padding: 0 18px; background: #caffdf; color: #07100d; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <small id="offline-kicker">NEVOLIUM · HORS CONNEXION</small>
      <h1 id="offline-title">Le cockpit attend le serveur</h1>
      <p id="offline-copy">Les données métier ne sont pas mises en cache dans ce lot. Reconnectez-vous pour reprendre les espaces et actions.</p>
      <button id="offline-retry" type="button" onclick="location.reload()">Réessayer</button>
    </main>
    <script>
      (() => {
        let language = 'fr'
        try {
          const saved = localStorage.getItem('nevolium.language.v1')
          language = saved === 'en' || saved === 'fr'
            ? saved
            : ((navigator.languages && navigator.languages[0]) || navigator.language || 'fr').toLowerCase().startsWith('en')
              ? 'en'
              : 'fr'
        } catch {
          language = (navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr'
        }
        if (language !== 'en') return
        document.documentElement.lang = 'en'
        document.title = 'Nevolium · offline'
        document.getElementById('offline-kicker').textContent = 'NEVOLIUM · OFFLINE'
        document.getElementById('offline-title').textContent = 'The cockpit is waiting for the server'
        document.getElementById('offline-copy').textContent = 'Business data is not cached in this lot. Reconnect to resume your spaces and actions.'
        document.getElementById('offline-retry').textContent = 'Retry'
      })()
    </script>
  </body>
</html>
