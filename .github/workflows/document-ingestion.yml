name: Document ingestion validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: document-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-execution-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prove bounded document execution and real subprocess cleanup
        run: uv run --locked --project services/worker python scripts/smoke/document_execution_contract.py

  editable-knowledge-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: nevolium
          POSTGRES_PASSWORD: nevolium-test-only
          POSTGRES_DB: nevolium_d07_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nevolium -d nevolium_d07_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://nevolium:nevolium-test-only@localhost:5432/nevolium_d07_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply canonical migrations through D07
        working-directory: services/core
        run: uv run --locked alembic upgrade head
      - name: Prove D07 editable knowledge, provenance, search and projection-failure recovery
        run: uv run --locked --project services/core python scripts/smoke/d07_editable_knowledge_db_contract.py

  document-ingestion-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deterministic document environment
        run: |
          cp .env.example .env
          echo 'NEVOLIUM_WORKER_EXTRAS=' >> .env
          echo 'NEVOLIUM_AUTH_ENABLED=false' >> .env

      - name: Start canonical document substrate
        run: |
          docker compose up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace nevolium-core nevolium-worker

      - name: Prove canonical document ingestion and versioned re-ingestion
        run: python scripts/smoke/document_ingestion.py

      - name: Dump document-ingestion state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=500 postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace nevolium-core nevolium-worker

      - name: Tear down document stack
        if: always()
        run: docker compose down -v --remove-orphans
