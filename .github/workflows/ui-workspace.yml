name: UI workspace validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ui-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-layout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prove uv workspace lockfile matches declarations
        run: uv lock --check
      - name: Prove canonical owner-scoped workspace layout contract
        run: uv run --locked --project services/core python scripts/smoke/workspace_layout_contract.py
      - name: Prove import payloads, corpus readback, resume and home preservation
        run: uv run --locked --project services/core python scripts/smoke/d09_example_import_contract.py
      - name: Prove D05 cockpit, keyboard, PWA and no-WebGL baseline
        run: python scripts/smoke/d05_cockpit_contract.py
      - name: Prove D06 FR/EN locale foundation
        run: python scripts/smoke/d06_locale_contract.py
      - name: Prove D06 canonical planning structure, projection and replanning
        run: uv run --locked --project services/core python scripts/smoke/d06_planning_structure_contract.py
      - name: Prove D06 deterministic critical path engine
        run: uv run --locked --project services/core python scripts/smoke/d06_critical_path_contract.py
      - name: Prove D06 bounded recurrence and DST semantics
        run: uv run --locked --project services/core python scripts/smoke/d06_recurrence_contract.py
      - name: Prove D06 work calendar and DST semantics
        run: uv run --locked --project services/core python scripts/smoke/d06_work_calendar_contract.py
      - name: Prove D06 list, Kanban and Gantt planning workspace
        run: python scripts/smoke/d06_planning_workspace_contract.py
      - name: Prove D07 canonical editable-knowledge foundation
        run: python scripts/smoke/d07_editable_knowledge_contract.py
      - name: Prove D07 Lexical editor, universal search and FR/EN web contract
        run: python scripts/smoke/d07_knowledge_editor_contract.py
      - name: Prove D08 bounded canonical mindmap projection and mutations
        run: python scripts/smoke/d08_mindmap_contract.py
      - name: Prove D08 deterministic radial graph fallback
        run: python scripts/smoke/d08_mindmap_graph_contract.py
      - name: Prove D08 persisted XYFlow web contract
        run: python scripts/smoke/d08_mindmap_web_contract.py
      - name: Prove canonical Project ownership contract
        run: uv run --locked --project services/core python scripts/smoke/project_ownership_contract.py
      - name: Prove Project-bound Task access contract
        run: uv run --locked --project services/core python scripts/smoke/project_bound_task_contract.py
      - name: Prove Task execution and Artifact ownership wrapper
        run: uv run --locked --project services/core python scripts/smoke/task_execution_ownership_contract.py
      - name: Prove public Task dispatch and internal resource bindings
        run: uv run --locked --project services/core python scripts/smoke/task_dispatch_contract.py
      - name: Prove Daily Spine planning and Today workspace contract
        run: uv run --locked --project services/core python scripts/smoke/daily_spine_contract.py
      - name: Compile Core UI, planning and knowledge models
        run: >-
          python -m compileall
          services/core/src/nevolium_core/ui_layouts.py
          services/core/src/nevolium_core/ui_models.py
          services/core/src/nevolium_core/project_access.py
          services/core/src/nevolium_core/document_models.py
          services/core/src/nevolium_core/editable_knowledge.py
          services/core/src/nevolium_core/knowledge.py
          services/core/src/nevolium_core/knowledge_exchange.py
          services/core/src/nevolium_core/mindmap.py
          services/core/src/nevolium_core/mindmap_schemas.py
          services/core/src/nevolium_core/planning.py
          services/core/src/nevolium_core/planning_critical_path.py
          services/core/src/nevolium_core/planning_critical_path_schemas.py
          services/core/src/nevolium_core/planning_engine.py
          services/core/src/nevolium_core/planning_models.py
          services/core/src/nevolium_core/planning_occurrences.py
          services/core/src/nevolium_core/planning_occurrence_schemas.py
          services/core/src/nevolium_core/planning_projection.py
          services/core/src/nevolium_core/planning_projection_schemas.py
          services/core/src/nevolium_core/planning_recurrence.py
          services/core/src/nevolium_core/planning_replan.py
          services/core/src/nevolium_core/planning_replan_schemas.py
          services/core/src/nevolium_core/planning_schemas.py
          services/core/src/nevolium_core/planning_structure.py
          services/core/src/nevolium_core/planning_structure_schemas.py
          services/core/src/nevolium_core/planning_work_calendar.py
          services/core/src/nevolium_core/planning_work_calendar_schemas.py
          services/core/src/nevolium_core/planning_work_calendars.py
          services/core/src/nevolium_core/workflows.py

  planning-structure-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: nevolium
          POSTGRES_PASSWORD: nevolium-test-only
          POSTGRES_DB: nevolium_d06_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nevolium -d nevolium_d06_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://nevolium:nevolium-test-only@localhost:5432/nevolium_d06_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply canonical migrations through current head
        working-directory: services/core
        run: uv run --locked alembic upgrade head
      - name: Prove D06 projection, CPM, replanning, cycles, conflicts and isolation on PostgreSQL
        run: uv run --locked --project services/core python scripts/smoke/d06_planning_structure_db_contract.py
      - name: Prove D06 virtual recurrence pagination and isolation on PostgreSQL
        run: uv run --locked --project services/core python scripts/smoke/d06_recurrence_db_contract.py
      - name: Prove D06 work calendar versioning and isolation on PostgreSQL
        run: uv run --locked --project services/core python scripts/smoke/d06_work_calendar_db_contract.py
      - name: Prove D06 explicit downstream replan effects on PostgreSQL
        run: uv run --locked --project services/core python scripts/smoke/d06_replan_effects_db_contract.py

  mindmap-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: nevolium
          POSTGRES_PASSWORD: nevolium-test-only
          POSTGRES_DB: nevolium_d08_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nevolium -d nevolium_d08_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://nevolium:nevolium-test-only@localhost:5432/nevolium_d08_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply canonical migrations through D08 base
        working-directory: services/core
        run: uv run --locked alembic upgrade head
      - name: Prove D09 transversal Mycelium provenance, pagination and isolation on PostgreSQL
        run: uv run --locked --project services/core python scripts/smoke/d09_mycelium_db_contract.py
      - name: Prove D08 bounded project mindmap and isolation on PostgreSQL
        run: uv run --locked --project services/core python scripts/smoke/d08_mindmap_db_contract.py

  cockpit-browser-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Prove D09 personalized home identity and folder model
        run: node --experimental-strip-types scripts/smoke/d09_home_model_contract.mjs
      - name: Prove D09 deterministic spatial graph projection
        run: node --experimental-strip-types scripts/smoke/d09_spatial_graph_contract.mjs
      - name: Prove D09 bounded camera and adaptive quality
        run: node --experimental-strip-types scripts/smoke/d09_presentation_contract.mjs
      - name: Prove D09 hardware measurements preserve interruptions and unknown memory
        run: node --experimental-strip-types scripts/smoke/d09_measurements_contract.mjs
      - name: Install the locked Web workspace
        run: pnpm install --frozen-lockfile
      - name: Prove organic D09 material preserves canonical edges and bounds geometry
        run: node --experimental-strip-types scripts/smoke/d09_organic_geometry_contract.mjs
      - name: Sparse project membership and flowing filaments
        run: node --experimental-strip-types scripts/smoke/d09_project_membership_contract.mjs
      - name: Build the isolated D05 preview
        env:
          VITE_NEVOLIUM_API_URL: http://127.0.0.1:8999
          VITE_NEVOLIUM_AUTH_ENABLED: "false"
        run: pnpm --filter @nevolium/web build
      - name: Build the self-contained D09 physical hardware kit
        env:
          NEVOLIUM_QUALIFICATION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node apps/web/qualification.build.mjs
      - name: Install the ephemeral browser runner
        id: browser-install
        run: |
          npm install \
            --prefix "$RUNNER_TEMP/nevolium-browser" \
            --package-lock=false \
            --no-save \
            playwright@1.55.0
          "$RUNNER_TEMP/nevolium-browser/node_modules/.bin/playwright" install --with-deps chromium
      # Make visual evidence available early; all cockpit regression gates still run.
      - name: Qualify D09 offline hardware kit and incomplete evidence export
        env:
          NEVOLIUM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nevolium-browser/node_modules/playwright/index.mjs
        run: node scripts/smoke/d09_hardware_kit_browser.mjs
      - name: Preserve D09 physical hardware kit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d09-hardware-kit
          path: artifacts/d09-hardware-kit
          if-no-files-found: error
      - name: Preserve D09 hardware kit browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d09-hardware-browser
          path: artifacts/d09-hardware-browser
          if-no-files-found: warn
      - name: Qualify shared Mycelium home, corpus traversal and personalization
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env:
          NEVOLIUM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nevolium-browser/node_modules/playwright/index.mjs
        run: node scripts/smoke/d09_home_browser_qualification.mjs
      - name: Preserve personalized Mycelium browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d09-home-browser
          path: artifacts/d09-home-browser
          if-no-files-found: warn
      - name: Qualify desktop, tablet, phone and panel popout
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env:
          NEVOLIUM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nevolium-browser/node_modules/playwright/index.mjs
        run: node scripts/smoke/d05_browser_qualification.mjs
      - name: Qualify D06 planning on touch tablet and phone
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env:
          NEVOLIUM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nevolium-browser/node_modules/playwright/index.mjs
        run: node scripts/smoke/d06_planning_browser_qualification.mjs
      - name: Qualify D07 editable knowledge, cross-space search and FR/EN
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env:
          NEVOLIUM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nevolium-browser/node_modules/playwright/index.mjs
        run: node scripts/smoke/d07_knowledge_browser_qualification.mjs
      - name: Qualify D08 editable mindmap, persistence, provenance and touch
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env:
          NEVOLIUM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nevolium-browser/node_modules/playwright/index.mjs
        run: node scripts/smoke/d08_mindmap_browser_qualification.mjs
      - name: Preserve D05 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d05-browser-qualification
          path: artifacts/d05-browser
          if-no-files-found: error
      - name: Preserve D06 planning browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d06-planning-browser-qualification
          path: artifacts/d06-planning-browser
          if-no-files-found: error
      - name: Preserve D07 knowledge browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d07-knowledge-browser-qualification
          path: artifacts/d07-knowledge-browser
          if-no-files-found: error
      - name: Preserve D08 mindmap browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d08-mindmap-browser-qualification
          path: artifacts/d08-mindmap-browser
          if-no-files-found: error

      - name: Preserve D09 spatial browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d09-spatial-browser-qualification
          path: artifacts/d09-spatial-browser
          if-no-files-found: warn
